name: Fix debug audit lockfile

on:
  push:
    branches:
      - fix/debug-pass-20260821
    paths:
      - .github/workflows/audit-fix-debug-lock.yml

permissions:
  contents: write

jobs:
  fix-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/debug-pass-20260821

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply non-breaking audit fixes to lockfile
        run: npm audit fix --package-lock-only --ignore-scripts

      - name: Commit lockfile when changed
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json has no audit-fix changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- package-lock.json
          git commit -m "chore: apply non-breaking audit lock fixes"
          git push origin HEAD:fix/debug-pass-20260821
