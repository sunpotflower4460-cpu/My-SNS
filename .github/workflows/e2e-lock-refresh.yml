name: E2E lock refresh

on:
  push:
    branches:
      - test/browser-smoke
    paths:
      - .github/e2e-lock-request

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: test/browser-smoke

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Add Playwright test dependency to lockfile
        run: npm install --save-dev --package-lock-only @playwright/test@1.62.1

      - name: Commit dependency metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "test: add Playwright browser test dependency"
            git push origin HEAD:test/browser-smoke
          fi
